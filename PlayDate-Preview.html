              <span className="text-xs text-emerald-400 flex items-center gap-1">
                <Icon name="users" size={12} /> {event.familiesGoing} going
              </span>
            </div>
          </div>
        </div>
        {event.featured && (
          <Button variant="primary" className="w-full mt-4">Join Event</Button>
        )}
      </Card>
    );

    const DailyChallenge = ({ challenge }) => (
      <Card className="p-4 bg-gradient-to-br from-emerald-500/10 to-teal-500/10 border-emerald-500/20">
        <div className="flex items-center justify-between mb-2">
          <div className="flex items-center gap-2">
            <span className="text-2xl">{challenge.emoji}</span>
            <div>
              <p className="text-xs text-emerald-400 uppercase tracking-wider font-medium">Today's Adventure</p>
              <h4 className="font-semibold text-white">{challenge.title}</h4>
            </div>
          </div>
          <Badge variant="success">+{challenge.points} pts</Badge>
        </div>
        <p className="text-sm text-gray-300 mb-3">{challenge.description}</p>
        <div className="flex gap-2">
          <Button variant="primary" className="flex-1">
            <Icon name="target" size={14} /> Accept
          </Button>
          <Button variant="ghost"><Icon name="refresh" size={14} /></Button>
          <Button variant="ghost"><Icon name="share" size={14} /></Button>
        </div>
      </Card>
    );

    const FamilyCard = ({ family }) => (
      <Card className="p-4">
        <div className="flex items-center justify-between">
          <div className="flex items-center gap-3">
            <div className={`w-3 h-3 rounded-full ${family.available ? 'bg-emerald-400' : 'bg-amber-400'}`} />
            <div>
              <div className="flex items-center gap-2">
                <p className="font-medium text-white">{family.name}</p>
                {family.verified && <Icon name="shield" size={12} className="text-emerald-400" />}
              </div>
              <p className="text-xs text-gray-400">Kids: {family.kids} • {family.distance}</p>
              <p className="text-xs text-gray-500 mt-1">{family.status}</p>
            </div>
          </div>
          <Button variant="primary" className="text-xs px-3 py-1.5">Say Hi</Button>
        </div>
      </Card>
    );

    const StatsDashboard = ({ stats }) => (
      <Card className="p-4 bg-gradient-to-br from-amber-500/10 to-orange-500/10 border-amber-500/20">
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-semibold text-white flex items-center gap-2">
            <Icon name="trophy" size={18} className="text-amber-400" />
            {stats.name}
          </h3>
          <Badge variant="warning">
            <Icon name="flame" size={12} /> {stats.streak} week streak!
          </Badge>
        </div>
        <div className="grid grid-cols-4 gap-4 text-center">
          <div>
            <p className="text-2xl font-bold text-white">{stats.badges}</p>
            <p className="text-xs text-gray-400">Badges</p>
          </div>
          <div>
            <p className="text-2xl font-bold text-white">{stats.adventures}</p>
            <p className="text-xs text-gray-400">Adventures</p>
          </div>
          <div>
            <p className="text-2xl font-bold text-white">{stats.places}</p>
            <p className="text-xs text-gray-400">Places</p>
          </div>
          <div>
            <p className="text-2xl font-bold text-white">{stats.playdates}</p>
            <p className="text-xs text-gray-400">Playdates</p>
          </div>
        </div>
      </Card>
    );

    const ActivityDetail = ({ activity, onClose }) => (
      <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center">
        <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={onClose} />
        <div className="relative w-full max-w-lg max-h-[90vh] overflow-auto bg-slate-900 rounded-t-3xl sm:rounded-3xl border border-white/10">
          <div className={`h-48 bg-gradient-to-br ${activity.heroColor} relative`}>
            <div className="absolute inset-0 flex items-center justify-center text-8xl opacity-30">{activity.image}</div>
            <button onClick={onClose} className="absolute top-4 right-4 p-2 bg-black/30 rounded-full hover:bg-black/50">
              <Icon name="x" size={20} />
            </button>
            <div className="absolute bottom-4 left-4 right-4">
              <div className="flex gap-2 mb-2">
                {activity.cost === 'Free' && <Badge variant="free">Free</Badge>}
                <Badge>{activity.type}</Badge>
              </div>
              <h2 className="text-2xl font-bold text-white drop-shadow-lg">{activity.name}</h2>
              <p className="text-white/80 text-sm">{activity.location}</p>
            </div>
          </div>
          
          <div className="flex items-center justify-around py-3 border-b border-white/10 bg-black/20">
            <div className="text-center">
              <p className="text-lg font-semibold text-white">{activity.distance}</p>
              <p className="text-xs text-gray-400">Distance</p>
            </div>
            <div className="text-center">
              <p className="text-lg font-semibold text-white">{activity.driveTime}</p>
              <p className="text-xs text-gray-400">Drive</p>
            </div>
            <div className="text-center">
              <p className="text-lg font-semibold text-white flex items-center justify-center gap-1">
                <Icon name="star" size={14} className="text-amber-400" /> {activity.rating}
              </p>
              <p className="text-xs text-gray-400">{activity.reviews} reviews</p>
            </div>
          </div>
          
          <div className="p-4 space-y-4">
            <p className="text-gray-300">{activity.description}</p>
            
            <div className="p-3 bg-emerald-500/10 rounded-xl border border-emerald-500/20">
              <p className="text-sm font-medium text-emerald-300">Great weather match today!</p>
              <p className="text-xs text-gray-400">Dry until 4pm - perfect for exploring</p>
            </div>
            
            <div className="p-3 bg-amber-500/10 rounded-xl border border-amber-500/20">
              <p className="text-sm font-medium text-amber-300 mb-1">💡 Pro Tip</p>
              <p className="text-sm text-gray-300">{activity.tip}</p>
            </div>
            
            <div>
              <p className="text-sm font-medium text-gray-400 mb-2">Features</p>
              <div className="flex flex-wrap gap-2">
                {activity.features.map((f, i) => <Badge key={i}>{f}</Badge>)}
              </div>
            </div>
          </div>
          
          <div className="p-4 border-t border-white/10 bg-black/20 flex gap-3">
            <Button variant="secondary" className="flex-1">
              <Icon name="heart" size={16} /> Save
            </Button>
            <Button variant="secondary" className="flex-1">
              <Icon name="share" size={16} /> Share
            </Button>
            <Button variant="primary" className="flex-1">
              <Icon name="navigation" size={16} /> Navigate
            </Button>
          </div>
        </div>
      </div>
    );

    // ============================================================================
    // MAIN APP
    // ============================================================================

    function PlayDateApp() {
      const [activeTab, setActiveTab] = useState('discover');
      const [selectedActivity, setSelectedActivity] = useState(null);
      const [category, setCategory] = useState('all');
      
      const todayChallenge = DAILY_CHALLENGES[new Date().getDay() % DAILY_CHALLENGES.length];
      
      const filteredLocations = LOCATIONS.filter(loc => {
        if (category === 'all') return true;
        if (category === 'free') return loc.cost === 'Free';
        if (category === 'outdoor') return ['nature', 'playground'].includes(loc.type);
        if (category === 'indoor') return ['indoor', 'heritage'].includes(loc.type);
        return true;
      });

      const categories = [
        { id: 'all', emoji: '✨', label: 'All' },
        { id: 'free', emoji: '🆓', label: 'Free' },
        { id: 'outdoor', emoji: '🌳', label: 'Outdoor' },
        { id: 'indoor', emoji: '🏠', label: 'Indoor' },
        { id: 'animals', emoji: '🐾', label: 'Animals' }
      ];

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 text-white">
          {/* Header */}
          <header className="sticky top-0 z-40 backdrop-blur-xl bg-slate-950/80 border-b border-white/5">
            <div className="max-w-lg mx-auto px-4 py-3">
              <div className="flex items-center justify-between">
                <div>
                  <h1 className="text-xl font-bold bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400 bg-clip-text text-transparent">
                    PlayDate
                  </h1>
                  <p className="text-xs text-gray-500">Saturday • Mid-term break</p>
                </div>
                <div className="flex items-center gap-4">
                  <div className="flex items-center gap-2 text-sm text-gray-300">
                    <Icon name="cloud" size={18} className="text-amber-400" />
                    <span>12°C</span>
                  </div>
                  <div className="flex items-center gap-1 text-sm">
                    <Icon name="flame" size={16} className="text-orange-400" />
                    <span className="text-orange-300 font-medium">3</span>
                  </div>
                  <button className="relative p-2 hover:bg-white/5 rounded-xl">
                    <Icon name="bell" size={20} className="text-gray-400" />
                    <span className="absolute top-1 right-1 w-2 h-2 bg-emerald-400 rounded-full" />
                  </button>
                </div>
              </div>
            </div>
          </header>

          {/* Tabs */}
          <div className="sticky top-14 z-30 bg-slate-950/90 backdrop-blur-xl border-b border-white/5">
            <div className="max-w-lg mx-auto px-4 py-2">
              <div className="flex gap-1 bg-white/5 p-1 rounded-xl">
                {[
                  { id: 'discover', label: 'Discover', icon: 'compass' },
                  { id: 'events', label: 'Events', icon: 'party' },
                  { id: 'families', label: 'Connect', icon: 'users' },
                  { id: 'challenges', label: 'Challenges', icon: 'target' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex-1 flex items-center justify-center gap-2 py-2.5 rounded-lg text-sm font-medium transition-all ${
                      activeTab === tab.id
                        ? 'bg-emerald-500/20 text-emerald-300'
                        : 'text-gray-500 hover:text-gray-300'
                    }`}
                  >
                    <Icon name={tab.icon} size={16} />
                    <span className="hidden sm:inline">{tab.label}</span>
                  </button>
                ))}
              </div>
            </div>
          </div>

          {/* Content */}
          <main className="max-w-lg mx-auto px-4 py-6 pb-24 space-y-6">
            
            {activeTab === 'discover' && (
              <>
                {/* Context Banner */}
                <Card className="p-4 bg-gradient-to-r from-emerald-500/20 to-teal-500/20 border-emerald-400/30">
                  <div className="flex items-start gap-3">
                    <Icon name="sparkles" className="text-emerald-400 mt-0.5" size={20} />
                    <div>
                      <p className="text-sm text-emerald-300 font-medium">Great conditions for exploring!</p>
                      <p className="text-xs text-gray-300 mt-1">Dry until 4pm, light showers this evening. Perfect for outdoor adventures!</p>
                    </div>
                  </div>
                </Card>

                {/* Daily Challenge */}
                <DailyChallenge challenge={todayChallenge} />

                {/* Categories */}
                <div>
                  <h3 className="text-sm font-medium text-gray-400 mb-3">What are you looking for?</h3>
                  <div className="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
                    {categories.map(cat => (
                      <button
                        key={cat.id}
                        onClick={() => setCategory(cat.id)}
                        className={`flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition-all ${
                          category === cat.id
                            ? 'bg-emerald-500/30 text-emerald-300 border border-emerald-500/40'
                            : 'bg-white/5 text-gray-400 hover:bg-white/10'
                        }`}
                      >
                        <span>{cat.emoji}</span>
                        <span>{cat.label}</span>
                      </button>
                    ))}
                  </div>
                </div>

                {/* Activities */}
                <div>
                  <div className="flex items-center justify-between mb-3">
                    <h3 className="text-sm font-medium text-gray-400">Perfect for today</h3>
                    <span className="text-xs text-gray-500">{filteredLocations.length} places</span>
                  </div>
                  <div className="space-y-4">
                    {filteredLocations.map(activity => (
                      <ActivityCard 
                        key={activity.id} 
                        activity={activity} 
                        onSelect={setSelectedActivity}
                      />
                    ))}
                  </div>
                </div>
              </>
            )}

            {activeTab === 'events' && (
              <>
                <div>
                  <h3 className="font-medium text-white flex items-center gap-2 mb-3">
                    <span className="text-xl">🎃</span> Halloween Events
                  </h3>
                  <div className="space-y-3">
                    {EVENTS.filter(e => e.featured).map(event => (
                      <EventCard key={event.id} event={event} />
                    ))}
                  </div>
                </div>
                
                <div>
                  <h3 className="font-medium text-white flex items-center gap-2 mb-3">
                    <Icon name="calendar" size={18} className="text-blue-400" />
                    Weekly Activities
                  </h3>
                  <div className="space-y-3">
                    {EVENTS.filter(e => !e.featured).map(event => (
                      <EventCard key={event.id} event={event} />
                    ))}
                  </div>
                </div>

                <Card className="p-4 bg-gradient-to-br from-blue-500/10 to-purple-500/10 border-blue-500/20">
                  <h4 className="font-medium text-white mb-2 flex items-center gap-2">
                    <Icon name="plus" size={18} className="text-blue-400" />
                    Create Your Own Event
                  </h4>
                  <p className="text-sm text-gray-400 mb-3">Planning a trip to the park? Invite other families!</p>
                  <Button variant="primary" className="w-full">Create Open Invitation</Button>
                </Card>
              </>
            )}

            {activeTab === 'families' && (
              <>
                <Card className="p-4 bg-gradient-to-r from-emerald-500/10 to-cyan-500/10 border-emerald-500/20">
                  <h4 className="font-medium text-white mb-2 flex items-center gap-2">
                    <Icon name="map-pin" size={18} className="text-emerald-400" />
                    Let families know where you're heading
                  </h4>
                  <p className="text-sm text-gray-400 mb-3">Broadcast your plans and invite others!</p>
                  <Button variant="primary" className="w-full">"We're heading to..." →</Button>
                </Card>

                <div>
                  <div className="flex items-center justify-between mb-3">
                    <h3 className="font-medium text-white flex items-center gap-2">
                      <div className="w-2 h-2 bg-emerald-400 rounded-full animate-pulse" />
                      Families Available Now
                    </h3>
                  </div>
                  <div className="space-y-3">
                    {NEARBY_FAMILIES.map(family => (
                      <FamilyCard key={family.id} family={family} />
                    ))}
                  </div>
                </div>

                <Card className="p-4">
                  <h4 className="font-medium text-white mb-2 flex items-center gap-2">
                    <Icon name="shield" size={18} className="text-emerald-400" />
                    Your Safety
                  </h4>
                  <p className="text-sm text-gray-400 mb-3">
                    All families with the shield badge have been ID verified. You're verified too!
                  </p>
                  <div className="flex gap-2">
                    <Badge variant="success">✓ ID Verified</Badge>
                    <Badge>12 Playdates</Badge>
                  </div>
                </Card>
              </>
            )}

            {activeTab === 'challenges' && (
              <>
                <StatsDashboard stats={FAMILY_STATS} />
                
                <DailyChallenge challenge={todayChallenge} />

                <Card className="p-4 bg-gradient-to-br from-purple-500/10 to-pink-500/10 border-purple-500/20">
                  <div className="flex items-center justify-between mb-3">
                    <div className="flex items-center gap-2">
                      <span className="text-2xl">🎃</span>
                      <div>
                        <h4 className="font-semibold text-white">Halloween Hero</h4>
                        <p className="text-xs text-gray-400">Complete by Oct 31</p>
                      </div>
                    </div>
                    <Badge variant="warning">Limited!</Badge>
                  </div>
                  <div className="mb-3">
                    <div className="flex justify-between text-xs mb-1">
                      <span className="text-gray-400">Progress</span>
                      <span className="text-emerald-300">2/5</span>
                    </div>
                    <div className="h-2 bg-black/30 rounded-full overflow-hidden">
                      <div className="h-full bg-gradient-to-r from-emerald-500 to-teal-400 rounded-full" style={{width: '40%'}} />
                    </div>
                  </div>
                  <div className="flex flex-wrap gap-2 mb-3">
                    <Badge variant="success">✓ Pumpkin patch</Badge>
                    <Badge variant="success">✓ Carve pumpkin</Badge>
                    <Badge>○ Spooky trail</Badge>
                    <Badge>○ Halloween craft</Badge>
                    <Badge>○ Halloween event</Badge>
                  </div>
                  <span className="text-xs text-purple-300">🏆 Halloween Hero Badge</span>
                </Card>

                <Card className="p-4">
                  <h4 className="font-medium text-white mb-3 flex items-center gap-2">
                    <Icon name="award" size={18} className="text-amber-400" />
                    Your Badges
                  </h4>
                  <div className="flex flex-wrap gap-3">
                    {['🌳', '🗺️', '👋', '☀️', '🏃', '📚', '🎨', '🦆'].map((badge, i) => (
                      <div key={i} className="w-12 h-12 rounded-xl bg-white/5 flex items-center justify-center text-2xl">
                        {badge}
                      </div>
                    ))}
                    <div className="w-12 h-12 rounded-xl bg-white/5 flex items-center justify-center text-gray-600 border-2 border-dashed border-gray-700">
                      <Icon name="plus" size={20} />
                    </div>
                  </div>
                </Card>
              </>
            )}
          </main>

          {/* Bottom Nav */}
          <nav className="fixed bottom-0 left-0 right-0 bg-slate-950/95 backdrop-blur-xl border-t border-white/5 z-40">
            <div className="max-w-lg mx-auto px-6 py-3">
              <div className="flex items-center justify-around">
                {[
                  { icon: 'home', label: 'Home' },
                  { icon: 'search', label: 'Search' },
                  { icon: 'plus', label: 'Plan', primary: true },
                  { icon: 'message', label: 'Messages' },
                  { icon: 'award', label: 'Profile' }
                ].map((item, i) => (
                  <button 
                    key={i}
                    className={`flex flex-col items-center gap-1 transition-colors ${
                      item.primary 
                        ? 'bg-emerald-500 p-3 rounded-2xl -mt-6 shadow-lg shadow-emerald-500/30 text-white' 
                        : 'text-gray-500 hover:text-emerald-400'
                    }`}
                  >
                    <Icon name={item.icon} size={item.primary ? 24 : 22} />
                    {!item.primary && <span className="text-xs">{item.label}</span>}
                  </button>
                ))}
              </div>
            </div>
          </nav>

          {/* Activity Detail Modal */}
          {selectedActivity && (
            <ActivityDetail 
              activity={selectedActivity} 
              onClose={() => setSelectedActivity(null)}
            />
          )}
        </div>
      );
    }

    // Render
    ReactDOM.createRoot(document.getElementById('root')).render(<PlayDateApp />);
  </script>
</body>
</html>
